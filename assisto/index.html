<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assisto</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B2B18">

<!--
  The game moved from tepatch.github.io/assisto/ to Firebase Hosting (#81). This page
  replaces the game at the old address and is the only thing left there.

  It does two jobs on its way out:

  1. It forwards every link ever shared (match invites ?room=, challenges ?run=,
     leagues ?league=) with its query string intact, because those links are the
     game's growth and a challenge link is meant to outlive the day it was sent.

  2. It carries the player's progress across. Storage belongs to an origin: the new
     address cannot read what this one kept. So this page reads it — the save
     (localStorage assisto.save.v1) and the anonymous Firebase identity (IndexedDB
     firebaseLocalStorageDb), which owns their board entries and league seats — and
     sends it in the URL fragment, #handoff=1.<base64url JSON>. A fragment is never sent
     to a server. The game imports it once (importHandoff in site/assisto.html), only
     into an empty game, and removes it from the address bar at once.

  Nothing here deletes anything: if the handoff fails, the data is still at this
  origin and the next visit tries again.

  GitHub Pages cannot issue a redirect, so this page is the redirect. Deployed by hand
  to the tepatch.github.io repository, folder assisto/, replacing the game's
  index.html. Keep the old sw.js there: it fetches navigations from the network first,
  so installed apps reach this page.
-->
<script>
(function(){
  var NEW = 'https://assisto-game.web.app/';
  var target = NEW + (location.search || '');
  var gone = false;
  function go(fragment){
    if(gone) return;
    gone = true;
    try{ location.replace(target + (fragment || '')); }
    catch(e){ location.href = target; }
  }
  // never strand a player here: whatever happens below, leave within two seconds
  setTimeout(function(){ go(''); }, 2000);

  function b64url(str){
    var bytes = new TextEncoder().encode(str), bin = '';
    for(var i = 0; i < bytes.length; i += 0x8000)
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function send(auth){
    var save = null;
    try{ save = localStorage.getItem('assisto.save.v1'); }catch(e){}
    if(!save && !(auth && auth.length)){ go(''); return; }   // nothing to carry
    try{
      var payload = { v: 1, at: Date.now(), ls: {}, auth: auth || [] };
      if(save) payload.ls['assisto.save.v1'] = save;
      go('#handoff=1.' + b64url(JSON.stringify(payload)));
    }catch(e){ go(''); }
  }
  // Firebase's signed-in user: database firebaseLocalStorageDb, store
  // firebaseLocalStorage, records { fbase_key: 'firebase:authUser:<apiKey>:[DEFAULT]', value }
  function readAuth(done){
    try{
      if(!window.indexedDB){ done([]); return; }
      var req = indexedDB.open('firebaseLocalStorageDb');
      req.onupgradeneeded = function(){
        // there was no database: do not leave an empty one behind
        try{ req.transaction.abort(); }catch(e){}
      };
      req.onerror = function(){ done([]); };
      req.onsuccess = function(){
        try{
          var db = req.result;
          if(!db.objectStoreNames.contains('firebaseLocalStorage')){ db.close(); done([]); return; }
          var all = db.transaction('firebaseLocalStorage', 'readonly').objectStore('firebaseLocalStorage').getAll();
          all.onsuccess = function(){
            var out = [];
            (all.result || []).forEach(function(r){
              if(r && typeof r.fbase_key === 'string' && r.fbase_key.indexOf('firebase:authUser:') === 0)
                out.push({ fbase_key: r.fbase_key, value: r.value });
            });
            try{ db.close(); }catch(e){}
            done(out);
          };
          all.onerror = function(){ done([]); };
        }catch(e){ done([]); }
      };
    }catch(e){ done([]); }
  }
  readAuth(send);
})();
</script>

<!--
  With scripting off, a meta refresh still gets them to the game. It cannot carry the
  progress or the query string; the link below keeps the address for anyone who wants it.
-->
<noscript><meta http-equiv="refresh" content="0; url=https://assisto-game.web.app/"></noscript>

  html,body{
    height:100%; margin:0; display:grid; place-items:center;
    background:#0B2B18; color:#EFEDE2;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    text-align:center; padding:6vmin;
  }
  a{ color:#F2A93B; }
  p{ max-width:34ch; line-height:1.5; }
</style>
</head>
<body>
  <p>Assisto has moved, and your progress is coming with it.<br>
     <a href="https://assisto-game.web.app/">Open the game</a></p>
</body>
</html>
