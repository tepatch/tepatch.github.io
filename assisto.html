<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assisto</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<!--
  The game moved to /assisto/ and this address stopped existing, so every link shared
  before the move returned a 404: match invites, challenge links, bookmarks.

  Those links are the game's growth, and a challenge link in particular is meant to
  outlive the day it was sent — the whole run is encoded in the query string. So the
  query string is what matters here: forwarding to /assisto/ without it would turn an
  invitation to a specific match into a cold open of the menu.

  GitHub Pages cannot issue a redirect, so this page is the redirect.
-->
<script>
  // location.replace rather than assignment: the dead address never enters history,
  // so Back does not bounce the player straight into it again.
  (function(){
    try{
      var to = '/assisto/' + (location.search || '') + (location.hash || '');
      location.replace(to);
    }catch(e){
      location.href = '/assisto/';
    }
  })();
</script>

<!--
  With scripting off, a meta refresh still gets them to the game. It cannot carry the
  query string, so a challenge link degrades to the menu rather than to nothing — and
  the link below keeps the full address for anyone who wants to copy it.
-->
<noscript><meta http-equiv="refresh" content="0; url=/assisto/"></noscript>

<style>
  html,body{
    height:100%; margin:0; display:grid; place-items:center;
    background:#0B2B18; color:#EFEDE2;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    text-align:center; padding:6vmin;
  }
  a{ color:#F2A93B; }
  p{ max-width:34ch; line-height:1.5; }
</style>
</head>
<body>
  <p>Assisto has moved.<br><a href="/assisto/">Open the game</a></p>
</body>
</html>
